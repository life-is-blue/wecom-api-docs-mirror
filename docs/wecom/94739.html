<div class="ep-doc-area-cherry cherry-markdown cherry-wecom" id="js-ep-doc-cnt-md"><div data-code-block-theme="coy" data-inline-code-theme="red"><h3 data-lines="1" data-sign="0d3d381784891a5a613044fd8a2c89e1" id="%E5%8A%9F%E8%83%BD%E4%BB%8B%E7%BB%8D"><a class="anchor" href="#%E5%8A%9F%E8%83%BD%E4%BB%8B%E7%BB%8D"></a>功能介绍</h3><p data-lines="2" data-sign="3f49508c488229db38c02610348bdc59" data-type="p">考虑到用户会在企业的小程序里联系客服，为此支持在小程序里接入微信客服，用户点击后即可打开对应的微信客服会话，发起客服咨询。<br/>该功能已向非个人的全体小程序开放，小程序开发者在小程序管理后台处，绑定同主体的微信客服（企业ID）后，即可调用小程序相关接口，接入微信客服。</p><p data-lines="2" data-sign="br2" data-type="br"> </p><h3 data-lines="1" data-sign="f99864ade01f3bfcf7bc1c9d0c6ccffc" id="%E6%8E%A5%E5%85%A5%E6%96%B9%E5%BC%8F"><a class="anchor" href="#%E6%8E%A5%E5%85%A5%E6%96%B9%E5%BC%8F"></a>接入方式</h3><p data-lines="5" data-sign="c36971bd242d8ab73c5b6c3797366853" data-type="p">1、在微信客服管理后台获取对外的企业ID和<a href="#31144" rel="nofollow" title="客服链接">客服链接</a><br/>2、在小程序管理后台的“功能-客服-微信客服“处，填写同一主体的微信客服对应的企业ID，完成小程序和微信客服的绑定。<br/>3、调用<a href="https://developers.weixin.qq.com/miniprogram/dev/api/open-api/service-chat/wx.openCustomerServiceChat.html" rel="nofollow" title="「小程序打开微信客服」">「小程序打开微信客服」</a>接口，完成接入。<br/>注：仅可正常接入已在小程序管理后台绑定的企业ID下的微信客服</p></div></div>
