<div class="ep-doc-area-cherry cherry-markdown cherry-wecom" id="js-ep-doc-cnt-md"><div data-code-block-theme="coy" data-inline-code-theme="red"><p data-lines="1" data-sign="61077fa708fe59545978ce85f611ad0b" data-type="p"><strong>当<a href="#19704" rel="nofollow">小程序关联到企业</a>后</strong>，可在未发布小程序的情况下，配置体验版进行体验，以方便进行开发</p><p data-lines="2" data-sign="3651922f926fa2ad2cb243d464cd0702" data-type="p"><strong>配置体验版流程</strong></p><ol class="cherry-list__default" data-lines="13" data-sign="3eee82d8407f4f3a40e41e261a9426edlist13" start="1"><li>开发者在微信开发者工具生成二维码<br/><img src="https://wework.qpic.cn/wwpic/41046_IFMAo4LgRMOZbJA_1584955028/0" width="300"/><br/></li><li>开发者使用企业微信扫描二维码打开小程序开发版<br/></li><li>点击进入右上角"..."--》点击配置体验版<br/><img src="http://p.qpic.cn/pic_wework/808606030/22247a3267c4a2e5421a5b3031890c5efcad5ec8d12ddb78/0" width="300"/><br/></li><li>进入页面选择体验成员后，发送体验邀请（被邀请的成员需在小程序可见范围内，可在管理端-应用与小程序-小程序详情页进行配置）<br/><img src="http://p.qpic.cn/pic_wework/985556960/71772961c95d08559c12ebe6077c5256e476b16fd3a534c5/0" width="300"/><br/></li><li>成员将收到小程序通知，通过点击小程序通知卡片即可使用该小程序体验版<br/><img src="http://p.qpic.cn/pic_wework/16809907/a6a0feb66b86c133b3652dfa37a1dcd977513c8619108b9a/0" width="300"/></li></ol></div></div>
