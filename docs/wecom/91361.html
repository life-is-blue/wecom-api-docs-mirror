<div class="ep-doc-area-cherry cherry-markdown cherry-wecom" id="js-ep-doc-cnt-md"><div data-code-block-theme="coy" data-inline-code-theme="red"><h2 data-lines="1" data-sign="0d390239049e0a9623a5fcee2fd8203b" id="%E7%AE%A1%E7%90%86%E7%AB%AF%E4%BD%BF%E7%94%A8%E5%B8%AE%E5%8A%A9"><a class="anchor" href="#%E7%AE%A1%E7%90%86%E7%AB%AF%E4%BD%BF%E7%94%A8%E5%B8%AE%E5%8A%A9"></a>管理端使用帮助</h2><p data-lines="1" data-sign="fdbd9c74fb45ba1d645e0d118ec6ac13" data-type="p">1、管理后台开启会话内容存档，开启前需设置开启范围、IP地址及消息加密公钥（注：员工的企业微信需升级到2.8.9版本及以上），开启后：</p><ul class="cherry-list__default" data-lines="2" data-sign="91e618be13b52e0f7e7c6d6483785f14list2"><li>开启存档的员工登录客户端，进入企业后会经过告知页面，获知后可继续使用</li><li>企业可以获取开启存档的员工和未开启员工之间的会话内容，但不能获取未开启员工之间的会话内容</li></ul><p data-lines="2" data-sign="br2" data-type="br"> </p><hr data-lines="1" data-sign="hr1"/><p data-lines="1" data-sign="cf9246cfad35f1c5eec39b5501a3c4fc" data-type="p">2、后续可修改相关设置，包括调用IP、消息加密公钥、功能禁用等。</p><p data-lines="2" data-sign="f4c00191931e3e95074a3ed3129b6154" data-type="p"><img alt="" src="https://wwcdn.weixin.qq.com/node/wework/images/audit_p3.png"/></p><hr data-lines="2" data-sign="hr2"/><p data-lines="3" data-sign="br3" data-type="br"> </p><h2 data-lines="1" data-sign="e7f48367d654ce1db771d4f7691ce795" id="%E5%85%B3%E4%BA%8E%E8%8E%B7%E5%8F%96%E4%BC%9A%E8%AF%9D%E5%86%85%E5%AE%B9"><a class="anchor" href="#%E5%85%B3%E4%BA%8E%E8%8E%B7%E5%8F%96%E4%BC%9A%E8%AF%9D%E5%86%85%E5%AE%B9"></a>关于获取会话内容</h2><p data-lines="2" data-sign="6d42ac022cd651fe8b904e652081b0f2" data-type="p">1、员工在企业内的会话内容，经告知员工后，企业可通过API获取。</p><p data-lines="2" data-sign="br2" data-type="br"> </p><p data-lines="1" data-sign="79886634ff105f66ee0fde4fb1ddcafd" data-type="p">2、员工与外部联系人的会话内容，经外部联系人同意后，企业可通过API获取。</p></div></div>
