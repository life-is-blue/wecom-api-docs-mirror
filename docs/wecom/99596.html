<div class="ep-doc-area-cherry cherry-markdown cherry-wecom" id="js-ep-doc-cnt-md"><div data-code-block-theme="coy" data-inline-code-theme="red"><h1 data-lines="1" data-sign="4fe7b94d4fde503f7bc740e8cb85229c" id="%E6%8F%90%E5%8D%87%E5%B9%BF%E5%91%8A%E6%9C%89%E6%95%88%E7%8E%87%E7%9A%84%E5%87%A0%E7%A7%8D%E6%96%B9%E5%BC%8F"><a class="anchor" href="#%E6%8F%90%E5%8D%87%E5%B9%BF%E5%91%8A%E6%9C%89%E6%95%88%E7%8E%87%E7%9A%84%E5%87%A0%E7%A7%8D%E6%96%B9%E5%BC%8F"></a>提升广告有效率的几种方式</h1><p data-lines="2" data-sign="5f5a97c72c692cc40fb9729d1be174aa" data-type="p">在广告中使用获客助手时，由于链路短、转化高，可降低获客成本，但同时也因为链路短，缺少了筛客环节，会添加一些低意向客户。以下方式可帮你过滤低质线索，提升广告有效率。</p><h2 data-lines="2" data-sign="79d5a8722d0e889a6edb81c473c22750" id="%E9%80%9A%E8%BF%87%E4%BC%98%E5%8C%96%E5%B9%BF%E5%91%8A%E8%90%BD%E5%9C%B0%E9%A1%B5%E6%8F%90%E5%8D%87%E6%9C%89%E6%95%88%E7%8E%87"><a class="anchor" href="#%E9%80%9A%E8%BF%87%E4%BC%98%E5%8C%96%E5%B9%BF%E5%91%8A%E8%90%BD%E5%9C%B0%E9%A1%B5%E6%8F%90%E5%8D%87%E6%9C%89%E6%95%88%E7%8E%87"></a>通过优化广告落地页提升有效率</h2><p data-lines="1" data-sign="49f514c0dec2c1ca04a91a8b4b24e4c0" data-type="p">可在落地页进行表单收集，筛选客户意向，再引导填写完成的客户添加成员。</p><p data-lines="2" data-sign="adadce2b0092fc1d099ea9980df32c5b" data-type="p"><img alt="1.png" src="https://wework.qpic.cn/wwpic3az/19676_dC8kxfTbTFeuone_1702966282/0"/></p><h2 data-lines="2" data-sign="1839bdfb6b9310b7df7c5b822992ca62" id="%E9%80%9A%E8%BF%87%E5%B9%BF%E5%91%8A%E5%9B%9E%E4%BC%A0%E6%8F%90%E5%8D%87%E6%9C%89%E6%95%88%E7%8E%87"><a class="anchor" href="#%E9%80%9A%E8%BF%87%E5%B9%BF%E5%91%8A%E5%9B%9E%E4%BC%A0%E6%8F%90%E5%8D%87%E6%9C%89%E6%95%88%E7%8E%87"></a>通过广告回传提升有效率</h2><p data-lines="1" data-sign="56d677149e0bb8e5f43e10a4e50f5378" data-type="p">除了用<a href="#15260/%E6%B7%BB%E5%8A%A0%E4%BC%81%E4%B8%9A%E5%AE%A2%E6%88%B7%E4%BA%8B%E4%BB%B6" rel="nofollow">「客户添加」</a>这种浅层动作进行广告回传以外，还可用获客助手提供的<a href="#47918/%E5%BE%AE%E4%BF%A1%E5%AE%A2%E6%88%B7%E5%8F%91%E8%B5%B7%E4%BC%9A%E8%AF%9D%E4%BA%8B%E4%BB%B6" rel="nofollow">「客户首次发消息」</a>等后端行为进行广告回传。</p><p data-lines="2" data-sign="aa93f19a086a7ecf9b556aaad87f20ac" data-type="p"><img alt="2.png" src="https://wework.qpic.cn/wwpic3az/605350_REu8gYNaQESrNSE_1702966394/0"/></p><h2 data-lines="2" data-sign="a8de7ba124616737c55b68e476ab2a97" id="%E9%80%9A%E8%BF%87%E5%BE%AE%E4%BF%A1%E5%AE%A2%E6%9C%8D%E4%BA%92%E5%8A%A8%E9%97%AE%E7%AD%94%E6%8F%90%E5%8D%87%E6%9C%89%E6%95%88%E7%8E%87"><a class="anchor" href="#%E9%80%9A%E8%BF%87%E5%BE%AE%E4%BF%A1%E5%AE%A2%E6%9C%8D%E4%BA%92%E5%8A%A8%E9%97%AE%E7%AD%94%E6%8F%90%E5%8D%87%E6%9C%89%E6%95%88%E7%8E%87"></a>通过微信客服互动问答提升有效率</h2><p data-lines="1" data-sign="16f9bd7aeccb58097a643d7c44328875" data-type="p">可引导客户从广告进入微信客服会话，通过互动问答进一步了解产品详情，明确客户需求后<a href="#31152/%E8%8E%B7%E5%AE%A2%E9%93%BE%E6%8E%A5%E6%B6%88%E6%81%AF" rel="nofollow">发送获客链接</a>，引导客户添加。</p><p data-lines="2" data-sign="9f80444aaf4abff1492796b423b03399" data-type="p"><img alt="3.png" src="https://wework.qpic.cn/wwpic3az/757751_Xpqvx17tSKO10fg_1702966453/0"/></p></div></div>
