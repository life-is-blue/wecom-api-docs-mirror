<div class="ep-doc-area-cherry cherry-markdown cherry-wecom" id="js-ep-doc-cnt-md"><div data-code-block-theme="coy" data-inline-code-theme="red"><p data-lines="3" data-sign="2e8035d940b98e93a731e5e386c7f1a9" data-type="p">API创建的日历，仅允许管理员对该日历进行删除/修改信息/修改通知范围等操作。<br/>为了让企业实时获取用户的操作，当用户进行了某种操作后，企业微信会将相应的事件推送给日历所属应用配置的<code>回调URL</code>（自建应用见<a href="#18555/%E5%BC%80%E5%8F%91%E6%B5%81%E7%A8%8B" rel="nofollow">配置日历回调参数</a>，第三方应用见[指令回调URL]()）。</p><p data-lines="2" data-sign="4809a86d63cd66fb198658d01ebd37f3" data-type="p">接收并解析事件的方法见：<a href="#12977" rel="nofollow">接收事件</a></p></div></div>
