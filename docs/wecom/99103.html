<div class="ep-doc-area-cherry cherry-markdown cherry-wecom" id="js-ep-doc-cnt-md"><div data-code-block-theme="coy" data-inline-code-theme="red"><p data-lines="2" data-sign="fc0ca36e5796e28fd80070f4288dbdda" data-type="p">应用通过接口创建的预约会议，当管理员或成员进行操作之后，企业微信会将相应的事件推送给应用配置的<code>回调URL</code>。<br/>接收并解析事件的方法见：<a href="#12977" rel="nofollow">接收事件</a></p><p data-lines="2" data-sign="79febd01e6beb4bd7bf9df1b031dea36" data-type="p">注意，未购买「会议高级功能」的企业，仅支持回调管理员<a href="#48488" rel="nofollow">修改会议</a>或<a href="#48489" rel="nofollow">取消会议</a>的事件，其余事件不会回调。</p></div></div>
