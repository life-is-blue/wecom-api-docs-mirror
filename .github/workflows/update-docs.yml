name: Update WeCom API Docs Mirror

on:
  push:
    paths:
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/update-docs.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "config/**"
      - "tests/**"
      - ".github/workflows/update-docs.yml"
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      strict_fetch:
        description: "1=fail on any fetch error, 0=tolerant mode"
        required: false
        default: "0"
      debug_doc_ids:
        description: "Debug only: comma-separated doc ids to capture raw HTML for (leave empty for a normal sync run)"
        required: false
        default: ""

permissions:
  contents: write

# Deliberately no workflow-level concurrency group: GitHub Actions applies a
# workflow-level group to every job's *run*, so a job-level group on top of
# it is additive, not a replacement -- three same-named-workflow runs still
# fight over the shared slot no matter what each job declares locally. Each
# job below sets its own group instead, so verify/sync/debug-capture can
# never cancel each other (verify is stateless and fast enough not to need
# one at all).
jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements-dev.txt

      - name: Run offline unit tests
        run: pytest tests/ -v

  sync:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.debug_doc_ids == '')
    runs-on: ubuntu-latest
    concurrency:
      group: wecom-api-docs-mirror-sync
      # false, not true: the checkpoint is only durable once "Commit and
      # push when changed" below actually runs -- everything fetch_wecom_docs.py
      # wrote up to that point lives solely on this ephemeral runner's disk.
      # Cancelling an in-flight sync (e.g. a manual dispatch racing today's
      # cron) would silently discard that whole run's progress with no
      # commit and no error. Queue instead of cancelling; CNB's equivalent
      # job already does this via `wait: true` in .cnb.yml.
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch docs
        # --resume is always safe: a no-op with no checkpoint present, and
        # continues an interrupted run (see docs/sync_progress.json) instead
        # of re-fetching from scratch, which matters a lot on a runner that
        # doesn't persist state between jobs -- see fetch_wecom_docs.py's
        # module docstring / README for why this is committed, not gitignored.
        env:
          STRICT_FETCH: ${{ github.event.inputs.strict_fetch || '0' }}
        run: python scripts/fetch_wecom_docs.py --resume

      - name: Commit and push when changed
        run: |
          if [[ -z "$(git status --porcelain docs/)" ]]; then
            echo "No docs changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "chore: sync docs $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push

  debug-capture-raw-html:
    # Ad hoc audit path: fetch a handful of doc ids' raw HTML (see
    # scripts/debug_capture_raw_html.py) so it can be diffed against the
    # converted docs/wecom/*.md, without touching the real sync/checkpoint.
    # Its own concurrency group, distinct from sync's, so triggering this
    # can't cancel an in-flight scheduled sync (see the note above jobs:).
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.debug_doc_ids != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
    concurrency:
      group: wecom-api-docs-mirror-debug
      cancel-in-progress: true

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Capture raw HTML
        env:
          DEBUG_DOC_IDS: ${{ github.event.inputs.debug_doc_ids }}
        run: python scripts/debug_capture_raw_html.py --doc-ids "$DEBUG_DOC_IDS"

      - name: Upload raw HTML as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-html-capture
          path: raw_html/
          retention-days: 7
